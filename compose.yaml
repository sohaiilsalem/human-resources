# Local development database: docker compose up -d
# The container and volume names are fixed so `docker compose` and plain `docker` commands
# (docker exec hrsaas-postgres ...) refer to the same database. See docs/DATABASE.md.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hrsaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrsaas
      POSTGRES_USER: hr_owner
      POSTGRES_PASSWORD: hr_owner
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: hrsaas-postgres-data
